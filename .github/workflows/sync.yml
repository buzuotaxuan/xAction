name: X Bookmarks → Notion Sync

on:
  schedule:
    # 北京时间 (UTC+8) 上午 9:00-9:35 之间，每天不同分钟数
    - cron: '0 1 * * 1'    # 周一 09:00 北京时间
    - cron: '15 1 * * 2'   # 周二 09:15 北京时间
    - cron: '30 1 * * 3'   # 周三 09:30 北京时间
    - cron: '45 1 * * 4'   # 周四 09:45 北京时间
    - cron: '5 1 * * 5'    # 周五 09:05 北京时间
    - cron: '20 1 * * 6'   # 周六 09:20 北京时间
    - cron: '35 1 * * 0'   # 周日 09:35 北京时间
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
        run: npm start
