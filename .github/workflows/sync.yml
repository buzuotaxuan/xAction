name: X Bookmarks → Notion Sync

on:
  schedule:
    # 北京时间 9:00-10:00 之间随机触发（多条 cron 模拟）
    - cron: '0 1 * * 1'    # 周一 9:00
    - cron: '15 1 * * 2'   # 周二 9:15
    - cron: '30 1 * * 3'   # 周三 9:30
    - cron: '45 1 * * 4'   # 周四 9:45
    - cron: '5 1 * * 5'    # 周五 9:05
    - cron: '20 1 * * 6'   # 周六 9:20
    - cron: '35 1 * * 0'   # 周日 9:35
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
        run: npm start
